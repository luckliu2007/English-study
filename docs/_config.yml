title: English Study 英语学习资源库
description: 面向中文学习者的高质量英语学习资源、自适应学习计划与打卡模板
lang: zh-CN
theme: minima

url: "https://luckliu2007.github.io"
baseurl: "/English-study"

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

header_pages:
  - index.md
  - learning-path.md
  - adaptive-plan.md
  - ai-english.md
  - listening.md
  - speaking.md
  - reading.md
  - writing.md
  - vocabulary-grammar.md
  - github-projects.md
  - awesome-lists.md
  - china-friendly.md
  - exams.md
  - developer-english.md
  - tools.md

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
