name: Link Check

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
  schedule:
    # 每周一 03:00 UTC 自动巡检一次，及时发现失效链接
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config ./lychee.toml
            --no-progress
            './**/*.md'
          fail: true
          jobSummary: true

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 自动巡检发现失效链接"
          content-filepath: ./lychee/out.md
          labels: broken-link, automated
