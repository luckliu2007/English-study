name: Content Check

on:
  push:
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'docs/**'
      - 'templates/**'
      - '*.md'
      - '.github/workflows/content-check.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'docs/**'
      - 'templates/**'
      - '*.md'
  schedule:
    # 每周一 03:00 UTC 巡检一次，防止链接在无内容改动期间悄悄失效
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r scripts/requirements.txt
      - name: Validate content against JSON Schema
        run: python scripts/validate_content.py
      - name: Check manifest is in sync
        run: python scripts/generate_manifest.py --check

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --accept 200,202,206,403,429
            --timeout 25
            --max-retries 3
            --retry-wait-time 5
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
